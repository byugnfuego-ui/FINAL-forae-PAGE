<!DOCTYPE html>
<html lang="mn">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>forae architects</title>
    <link rel="stylesheet" href="style.css">
</head>
<body oncontextmenu="return false;">

    <!-- Дээд талын 2 булан -->
    <header>
        <div class="top-left">forae architects</div>
        <div class="top-right">
            <a href="mailto:info@forea.net">info@forea.net</a>
        </div>
    </header>

    <!-- Голын цагаан дэвсгэртэй ганц зураг -->
    <main class="gallery">
        <div class="image-container">
            <img src="image_PzhztE.png" alt="Landscape Painting" ondragstart="return false;">
        </div>
    </main>

    <!-- Доод талын 2 булан -->
    <footer>
        <!-- id="reference-link" нэмж, дарагддаг болгов -->
        <div class="bottom-left" id="reference-link" style="cursor: pointer;">
            <span>reference</span>
        </div>
        <div class="bottom-right">
            <span>Ulaanbaatar, Mongolia</span>
            <span>TEL: +98105421</span>
        </div>
    </footer>

    <!-- Reference дээр дарахад харагдах Нууц Цонх (Modal) -->
    <div id="quote-modal" class="modal">
        <div class="modal-content">
            <span class="close-btn">&times;</span>
            <h2>Номын ишлэлүүд</h2>
            <div class="quotes-list">
                <p>“Архитектур бол хөлдсөн хөгжим юм.” – <i>Иоганн Вольфганг фон Гёте</i></p>
                <p>“Хэлбэр нь үүргийг дагана.” – <i>Луис Салливан</i></p>
                <p>“Бага бол илүү.” – <i>Людвиг Мис ван дер Роэ</i></p>
                <!-- Энд өөрийн хүссэн бусад ишлэлүүдээ нэмж бичнэ үү -->
            </div>
        </div>
    </div>

    <!-- Цонхыг ажиллуулах JavaScript код -->
    <script>
        const refLink = document.getElementById('reference-link');
        const modal = document.getElementById('quote-modal');
        const closeBtn = document.querySelector('.close-btn');

        // reference дээр дарахад цонх нээгдэнэ
        refLink.onclick = function() {
            modal.style.display = "flex";
        }

        // Хэрээс (X) дээр дарахад цонх хаагдана
        closeBtn.onclick = function() {
            modal.style.display = "none";
        }

        // Цонхны гадна талын цагаан дэвсгэр дээр дарахад мөн хаагдана
        window.onclick = function(event) {
            if (event.target == modal) {
                modal.style.display = "none";
            }
        }
    </script>

</body>
</html>
